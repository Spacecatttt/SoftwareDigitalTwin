<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Ditto Integration</title>
<style>
  body { margin: 0; background: #fcfcfb; font-family: "Segoe UI", system-ui, sans-serif; }
  svg { display: block; }
  .t { font-size: 15px; font-weight: 650; fill: #0b0b0b; }
  .s { font-size: 13px; fill: #52514e; }
  .h { font-size: 13px; font-weight: 700; fill: #898781; letter-spacing: .04em; }
  .lbl { font-size: 13px; fill: #52514e; }
  .lb { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<!-- integration of the lab 3 pipeline with Eclipse Ditto (lab 4), sized for an A4 page -->
<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
  </defs>
  <rect width="1000" height="760" fill="#fcfcfb"/>

  <!-- row 1: labs 1-3 -->
  <rect x="20" y="20" width="250" height="112" rx="8" fill="#f0efec" stroke="#c3c2b7"/>
  <text class="t" x="34" y="46">Емулятор принтера × N</text>
  <text class="s" x="34" y="68">emulator.py (роботи 1–2):</text>
  <text class="s" x="34" y="86">телеметрія 10 / 1 Гц, LWT;</text>
  <text class="s" x="34" y="104">команди emergencyCooldown</text>

  <rect x="365" y="20" width="270" height="112" rx="8" fill="#f0efec" stroke="#c3c2b7"/>
  <text class="t" x="379" y="46">MQTT-брокер Mosquitto</text>
  <text class="s" x="379" y="68">factory/{id}/telemetry/…, status</text>
  <text class="s" x="379" y="86">factory/{id}/twin/state (retained)</text>
  <text class="s" x="379" y="104">factory/{id}/commands</text>

  <rect x="730" y="20" width="250" height="112" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
  <text class="t" x="744" y="46">Конвеєр pipeline.py</text>
  <text class="s" x="744" y="68">(робота 3): обробка потоку,</text>
  <text class="s" x="744" y="86">модель стану, правила</text>
  <text class="s" x="744" y="104">синхронізації → InfluxDB</text>

  <line x1="270" y1="55" x2="361" y2="55" stroke="#52514e" stroke-width="1.7" marker-end="url(#a)"/>
  <text class="lbl" x="282" y="47">publish</text>
  <line x1="365" y1="108" x2="274" y2="108" stroke="#eb6834" stroke-width="1.7" marker-end="url(#o)"/>
  <text class="lb" x="280" y="126" fill="#eb6834">commands</text>
  <line x1="635" y1="55" x2="726" y2="55" stroke="#52514e" stroke-width="1.7" marker-end="url(#a)"/>
  <text class="lbl" x="645" y="47">telemetry</text>
  <line x1="730" y1="108" x2="639" y2="108" stroke="#52514e" stroke-width="1.7" marker-end="url(#a)"/>
  <text class="lbl" x="645" y="126">twin/state</text>

  <!-- row 2: adapter -->
  <rect x="150" y="200" width="700" height="132" rx="8" fill="#e6f6f0" stroke="#1baf7a"/>
  <text class="t" x="166" y="226">Адаптер ditto_adapter.py (користувач Ditto «adapter»)</text>
  <text class="s" x="166" y="250">→ стан конвеєра → властивості 8 двійників принтера (таблиця MAPPING)</text>
  <text class="s" x="166" y="270">→ лише змінені властивості → об'єднання за 250 мс → паралельні запити</text>
  <text class="s" x="166" y="290">→ PATCH merge-patch, If-Match: *, correlation-id з часом відправлення</text>
  <text class="s" x="166" y="310">← WebSocket START-SEND-MESSAGES: дія WoT → MQTT factory/{id}/commands</text>

  <line x1="430" y1="132" x2="430" y2="196" stroke="#52514e" stroke-width="1.7" marker-end="url(#a)"/>
  <text class="lbl" x="438" y="170">factory/+/twin/state</text>
  <line x1="590" y1="200" x2="590" y2="136" stroke="#eb6834" stroke-width="1.7" marker-end="url(#o)"/>
  <text class="lb" x="598" y="170" fill="#eb6834">factory/{id}/commands</text>

  <!-- row 3: ditto -->
  <rect x="20" y="410" width="650" height="330" rx="10" fill="#fdefe8" stroke="#eb6834"/>
  <text class="h" x="36" y="434">ECLIPSE DITTO 3.9.7 (docker compose dt_soft)</text>
  <rect x="36" y="448" width="300" height="134" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text class="t" x="50" y="472">ditto-nginx :8180</text>
  <text class="s" x="50" y="494">basic auth → суб'єкт nginx:&lt;user&gt;</text>
  <text class="s" x="50" y="512">/api, /ws → gateway; /ui → Explorer UI</text>
  <text class="s" x="50" y="530">/models → WoT Thing Models</text>
  <text class="s" x="50" y="548">(http://wot-models/models/…)</text>
  <rect x="352" y="448" width="302" height="134" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text class="t" x="366" y="472">gateway</text>
  <text class="s" x="366" y="494">HTTP API /api/2</text>
  <text class="s" x="366" y="512">WebSocket /ws/2 (Ditto Protocol)</text>
  <text class="s" x="366" y="530">Server-Sent Events</text>
  <rect x="36" y="596" width="148" height="128" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text class="t" x="48" y="620">things</text>
  <text class="s" x="48" y="642">двійники, події,</text>
  <text class="s" x="48" y="660">історія,</text>
  <text class="s" x="48" y="678">валідація WoT</text>
  <rect x="196" y="596" width="148" height="128" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text class="t" x="208" y="620">policies</text>
  <text class="s" x="208" y="642">права: owner,</text>
  <text class="s" x="208" y="660">adapter, monitor</text>
  <rect x="356" y="596" width="148" height="128" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text class="t" x="368" y="620">things-search</text>
  <text class="s" x="368" y="642">індекс, RQL,</text>
  <text class="s" x="368" y="660">count, cursor</text>
  <rect x="516" y="596" width="138" height="128" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text class="t" x="528" y="620">MongoDB</text>
  <text class="s" x="528" y="642">журнал подій,</text>
  <text class="s" x="528" y="660">знімки, індекс</text>

  <line x1="280" y1="332" x2="280" y2="406" stroke="#52514e" stroke-width="1.7" marker-end="url(#a)"/>
  <text class="lbl" x="288" y="374">HTTP PATCH (merge)</text>
  <line x1="560" y1="410" x2="560" y2="336" stroke="#eb6834" stroke-width="1.7" marker-end="url(#o)"/>
  <text class="lb" x="568" y="374" fill="#eb6834">WS: повідомлення (дія WoT)</text>

  <!-- consumers -->
  <rect x="740" y="410" width="240" height="176" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
  <text class="t" x="754" y="436">Монітор ditto_monitor.py</text>
  <text class="s" x="754" y="460">WS START-SEND-EVENTS</text>
  <text class="s" x="754" y="478">з RQL-фільтром</text>
  <text class="s" x="754" y="496">(thermalState, link status)</text>
  <text class="s" x="754" y="518">→ тривога принтера,</text>
  <text class="s" x="754" y="536">→ зведення ферми,</text>
  <text class="s" x="754" y="554">→ дія emergencyCooldown</text>
  <rect x="740" y="616" width="240" height="124" rx="8" fill="#f0efec" stroke="#c3c2b7"/>
  <text class="t" x="754" y="642">ditto_query.py, UI</text>
  <text class="s" x="754" y="664">стан, пошук, обхід</text>
  <text class="s" x="754" y="682">графа, WoT TD, історія</text>

  <line x1="670" y1="450" x2="736" y2="450" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#b)"/>
  <text class="lb" x="676" y="443" fill="#2a78d6">події</text>
  <line x1="740" y1="540" x2="674" y2="540" stroke="#eb6834" stroke-width="1.7" marker-end="url(#o)"/>
  <text class="lb" x="676" y="533" fill="#eb6834">PATCH,</text>
  <text class="lb" x="676" y="558" fill="#eb6834">POST</text>
  <line x1="674" y1="680" x2="736" y2="680" stroke="#52514e" stroke-width="1.7" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="684" y="672">HTTP</text>
</svg>
</body>
</html>
