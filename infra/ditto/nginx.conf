# Front door of the Eclipse Ditto deployment (based on ditto/deployment/docker/nginx.conf of Ditto 3.9.7):
#  - /api, /ws      HTTP and WebSocket API, basic auth; the user is passed to Ditto as pre-authenticated
#                   subject "nginx:<user>" (users: ditto - owner, adapter - pipeline adapter, monitor - event monitor)
#  - /models        WoT Thing Models of the twins (no auth, Ditto downloads them as http://wot-models/models/...)
#  - /ui/           Ditto Explorer UI, /devops - Ditto devops API (own basic auth devops:foobar)
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  charset utf-8;
  default_type application/json;
  server_tokens off;

  # slightly above the 60 s read timeout of the gateway
  proxy_connect_timeout 70;
  proxy_send_timeout 70;
  proxy_read_timeout 70;
  send_timeout 70;

  client_header_buffer_size 8k;   # long search URIs
  large_client_header_buffers 4 16k;
  merge_slashes off;

  # re-resolve the containers via the Docker DNS: after "docker compose up" recreates the gateway it gets a new IP,
  # a statically resolved upstream would keep sending requests to the old address
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name localhost;
    absolute_redirect off;   # keep the published port (8180) in redirects
    root /etc/nginx/ditto/html;
    set $gateway http://gateway:8080;
    set $ditto_ui http://ditto-ui:8080;

    location = / {
      return 302 /ui/?environmentsURL=/ui-environments.json&primaryEnvironmentName=dt_soft;
    }

    location = /ui-environments.json {
      add_header Cache-Control no-store;
    }

    location /models/ {
      alias /usr/share/nginx/models/;
      # application/json: browsers display the model instead of downloading it (Ditto accepts both)
      types { application/json jsonld; }
      autoindex on;             # browsable list of the models
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control no-store;
    }

    location /api {
      auth_basic                    "Ditto";
      auth_basic_user_file          /etc/nginx/ditto/nginx.htpasswd;

      proxy_pass                    $gateway;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              x-ditto-pre-authenticated "nginx:${remote_user}";

      proxy_set_header Connection  '';
      chunked_transfer_encoding    off;
      proxy_buffering              off;   # server sent events
      proxy_cache                  off;
    }

    location /ws {
      auth_basic                    "Ditto";
      auth_basic_user_file          /etc/nginx/ditto/nginx.htpasswd;

      proxy_pass                    $gateway;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header              Upgrade                   $http_upgrade;
      proxy_set_header              Connection                "upgrade";
      proxy_read_timeout            1d;
      proxy_send_timeout            1d;
    }

    location /health {
      proxy_pass                    $gateway;
    }

    location /status {
      proxy_pass                    $gateway/overall/status;
    }

    location /devops {
      proxy_pass                    $gateway;
      proxy_http_version            1.1;
    }

    location /ui/ {
      rewrite ^/ui/(.*)$ /$1 break;
      proxy_pass                    $ditto_ui;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }
  }
}
